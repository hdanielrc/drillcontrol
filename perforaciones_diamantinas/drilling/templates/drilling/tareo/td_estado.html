<td class="celda-{{ estado_code2 }} {% if dia.es_cambio_guardia %}dia-cambio-guardia{% elif dia.es_previo_cambio %}dia-previo-cambio{% endif %}"
    data-estado="{{ estado_code2 }}"
    data-trabajador-id="{{ row.trabajador.id }}"
    data-fecha="{{ dia.fecha|date:'Y-m-d' }}">
    <select 
        name="estado_{{ row.trabajador.id }}_{{ dia.fecha|date:'Y_m-d' }}" 
        class="estado-select estado-{{ estado_code2 }}"
        data-tipo="estado"
        onchange="(function(sel){ sel.className='estado-select estado-' + sel.value; var td=sel.closest('td'); var tr=td.closest('tr'); td.className=td.className.replace(/\bcelda-\S+/g,'').trim()+' celda-'+sel.value; td.setAttribute('data-estado',sel.value); tr.classList.add('dirty-row'); if (typeof actualizarSummaryRows === 'function') actualizarSummaryRows(); })(this)"
        title="{{ estado_code2 }}"
    >
        <option value="T"    {% if estado_code2 == 'T'    %}selected{% endif %}>T</option>
        <option value="TD"   {% if estado_code2 == 'TD'   or not estado_code2 %}selected{% endif %}>TD</option>
        <option value="TN"   {% if estado_code2 == 'TN'   %}selected{% endif %}>TN</option>
        <option value="TI"   {% if estado_code2 == 'TI'   %}selected{% endif %}>TI</option>
        <option value="DL"   {% if estado_code2 == 'DL'   %}selected{% endif %}>DL</option>
        <option value="DA"   {% if estado_code2 == 'DA'   %}selected{% endif %}>DA</option>
        <option value="PT"   {% if estado_code2 == 'PT'   %}selected{% endif %}>PT</option>
        <option value="DM"   {% if estado_code2 == 'DM'   %}selected{% endif %}>DM</option>
        <option value="SB"   {% if estado_code2 == 'SB'   %}selected{% endif %}>SB</option>
        <option value="SUB"  {% if estado_code2 == 'SUB'  %}selected{% endif %}>SUB</option>
        <option value="I"    {% if estado_code2 == 'I'    %}selected{% endif %}>I</option>
        <option value="IV"   {% if estado_code2 == 'IV'   %}selected{% endif %}>IV</option>
        <option value="R"    {% if estado_code2 == 'R'    %}selected{% endif %}>R</option>
        <option value="F"    {% if estado_code2 == 'F'    %}selected{% endif %}>F</option>
        <option value="S"    {% if estado_code2 == 'S'    %}selected{% endif %}>S</option>
        <option value="V"    {% if estado_code2 == 'V'    %}selected{% endif %}>V</option>
        <option value="LSG"  {% if estado_code2 == 'LSG'  %}selected{% endif %}>LSG</option>
        <option value="C"    {% if estado_code2 == 'C'    %}selected{% endif %}>C</option>
        <option value="TC1"  {% if estado_code2 == 'TC1'  %}selected{% endif %}>TC1</option>
        <option value="LFC"  {% if estado_code2 == 'LFC'  %}selected{% endif %}>LFC</option>
        <option value="DA1"  {% if estado_code2 == 'DA1'  %}selected{% endif %}>DA1</option>
        <option value="LCG"  {% if estado_code2 == 'LCG'  %}selected{% endif %}>LCG</option>
    </select>
    <!-- Select de Máquina por día (hidden, visible on hover via CSS) -->
    <select
        name="maquina_{{ row.trabajador.id }}_{{ dia.fecha|date:'Y_m-d' }}"
        class="maquina-select"
        data-tipo="maquina"
        style="margin-top:2px; font-size:9px; padding:1px; width:100%; border:1px solid #95a5a6; border-radius:3px; background:#f8f9fa; font-weight:600;"
        title="Máquina asignada para este día específico">
        <option value="">—</option>
        {% for maq in maquinas_disponibles %}
        <option value="{{ maq.id }}"
            {% if data and data.maquina_id and data.maquina_id == maq.id %}
                selected
            {% elif not data and row.trabajador.maquina_asignada and row.trabajador.maquina_asignada.id == maq.id %}
                selected
            {% endif %}>
            {{ maq.codigo|default:maq.nombre }}
        </option>
        {% endfor %}
    </select>
    <!-- Indicador compacto -->
    <div style="margin-top:1px; font-size:9px; line-height:1;">
        {% if data %}
            {% if data.es_proyeccion or data.tipo == 'PROY' %}
                <span class="proyeccion-indicator es-proyeccion" title="Proyección automática">P</span>
            {% else %}
                <span class="proyeccion-indicator es-correccion" title="Registro manual confirmado">✓</span>
            {% endif %}
        {% else %}
            <span style="background:#fff3cd;color:#856404;padding:1px 2px;border-radius:2px;font-size:8px;" title="Sin registro">⚠️</span>
        {% endif %}
        <!-- Guardia override (hidden, visible on hover via CSS) -->
        <select name="guardia_{{ row.trabajador.id }}_{{ dia.fecha|date:'Y_m-d' }}"
                class="guardia-cell-select"
                data-tipo="guardia_snapshot"
                style="font-size:9px; padding:1px 2px; border-radius:2px; width:42px; margin-top:2px;">
            <option value="" {% if not data.guardia_snapshot %}selected{% endif %}>—</option>
            <option value="A" {% if data.guardia_snapshot == 'A' %}selected{% endif %}>A</option>
            <option value="B" {% if data.guardia_snapshot == 'B' %}selected{% endif %}>B</option>
            <option value="C" {% if data.guardia_snapshot == 'C' %}selected{% endif %}>C</option>
        </select>
    </div>
    <!-- Campo oculto para observaciones -->
    <input type="hidden" 
           name="observaciones_{{ row.trabajador.id }}_{{ dia.fecha|date:'Y_m-d' }}" 
           data-tipo="observaciones"
           value="{{ data.observaciones|default:'' }}">
</td>
